id: DEC-001
status: APPROVED
title: "Adopt AI governance V1.0 as repository baseline"
date: "2026-08-08"
problem: "The repository needs an explicit approved governance baseline so that AI agents can operate against a persistent, reconstructible set of rules."
context: "The governance specification, core agent rules, authority model, knowledge policy, response protocol, invariants, schemas, templates, validator, tests, and CI have been established as the initial framework."
alternatives:
  - "Adopt governance V1.0 as the current operational baseline."
  - "Keep the framework provisional and without an approved baseline."
decision: "Adopt governance V1.0 as the current operational baseline of this repository."
rationale: "An explicit approved baseline is required to distinguish normative project knowledge from provisional discussion and to make future changes traceable."
consequences:
  - "Future incompatible instructions are treated as proposed baseline changes rather than silent replacements."
  - "Agents must use the repository governance as persistent project knowledge."
affected_items:
  - "AGENTS.md"
  - "governance/SPECIFICATION.md"
  - "governance/authority.md"
  - "governance/knowledge-policy.md"
  - "governance/response-protocol.md"
  - "governance/invariants.md"
supersedes: []
superseded_by: null
evidence:
  - "Explicit user approval on 2026-08-08."

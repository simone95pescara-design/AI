id: DEC-004
status: PROPOSED
title: "Adopt Repository Engineering V1"
date: "2026-08-08"
problem: "The repository has accumulated governance documents, schemas, artifacts, tests and Python compliance code without an explicit repository architecture, canonical language/naming policy, or Python package boundaries. Continued feature growth risks recreating the disorder the framework is intended to prevent."
context: "The audit identified mixed Italian/English documentation, inconsistent naming/casing conventions, no canonical README entry point, no pyproject/package structure, a growing compliance/validate.py with multiple responsibilities, and no authoritative repository layout policy. DEC-003 is intentionally frozen pending this engineering alignment."
alternatives:
  - "Continue incremental growth and refactor later."
  - "Define and approve repository architecture, language/naming conventions, documentation taxonomy, and Python package boundaries before further functional expansion."
  - "Translate and rename current files immediately without first defining a target architecture."
decision: "PROPOSED: freeze functional expansion and adopt Repository Engineering V1 before refactoring or translating the repository."
rationale: "Architecture and conventions must precede migration; otherwise translation, renaming and refactoring risk being repeated or producing a different form of inconsistency."
consequences:
  - "DEC-003 remains unapproved until repository-engineering alignment is reviewed."
  - "No broad translation/renaming is performed before target conventions are approved."
  - "Python compliance tooling will be refactored only after package/module boundaries are approved."
  - "Future file placement and naming must follow an authoritative repository layout policy."
affected_items:
  - "repository layout"
  - "documentation"
  - "governance"
  - "compliance tooling"
  - "tests"
  - "CI"
supersedes: []
superseded_by: null
evidence:
  - "Repository Engineering Audit findings ENG-01..ENG-10 from 2026-08-08."
  - "No README or pyproject.toml was found during the audit."
  - "compliance/validate.py currently combines parsing, schema validation, semantic validation, graph checks, secret scanning and CLI output."

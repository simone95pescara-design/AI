id: DEC-004
status: APPROVED
title: "Adopt Repository Engineering V1"
date: "2026-08-08"
problem: "The repository has accumulated governance documents, schemas, artifacts, tests and Python compliance code without an explicit enforceable repository architecture, canonical language/naming policy, Python package boundaries, dependency rules, or migration contract. Continued feature growth risks recreating the disorder the framework is intended to prevent."
context: "The audit identified mixed Italian/English documentation, inconsistent naming/casing conventions, no canonical README entry point, no pyproject/package structure, a growing compliance/validate.py with multiple responsibilities, weak architectural boundaries, and no authoritative repository layout policy. DEC-003 is intentionally frozen pending this engineering alignment."
alternatives:
  - "Continue incremental growth and refactor later."
  - "Define and approve an enforceable repository architecture, language/naming conventions, documentation taxonomy, Python boundaries, dependency direction, registry/error contracts, characterization tests and migration strategy before further functional expansion."
  - "Translate, rename or split current files immediately without first defining target architecture and equivalence criteria."
decision: "APPROVED: freeze functional expansion and adopt Repository Engineering V1 before refactoring, translating, renaming or extending governance software."
rationale: "Architecture, enforceable boundaries and behavior-equivalence criteria must precede migration; otherwise translation, renaming and refactoring risk being repeated or merely distributing the same coupling across more files."
consequences:
  - "DEC-003 remains unapproved until repository-engineering alignment is reviewed."
  - "No broad translation/renaming is performed before target conventions are approved."
  - "Python compliance tooling will be refactored only after characterization tests and package/module boundaries are approved."
  - "Machine-readable contracts remain in English while human/normative prose is standardized in Italian."
  - "Future file placement, naming and dependency direction must follow an authoritative and testable repository architecture."
  - "New external dependencies require explicit admission rationale."
  - "Architecture tests and migration checks are required before the refactoring can be declared complete."
affected_items:
  - "repository layout"
  - "documentation"
  - "governance"
  - "compliance tooling"
  - "tests"
  - "CI"
  - "packaging"
  - "dependency management"
supersedes: []
superseded_by: null
evidence:

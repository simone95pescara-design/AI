name: Governance Compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install ".[test]"
      - name: Run validator
        run: python compliance/validate.py
      - name: Run tests
        run: python -m pytest tests/unit tests/governance tests/characterization tests/architecture tests/integration

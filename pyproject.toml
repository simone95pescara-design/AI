[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-framework"
version = "0.1.0"
description = "Governance framework for reconstructible and controlled AI-assisted projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
ai-governance-compliance = "ai_governance.cli.compliance:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_governance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
